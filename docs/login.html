<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Mentores</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f2937;
    }
    .card {
      width: min(380px, 92vw);
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p.sub { margin: 0 0 22px; color: #6b7280; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 600; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }
    input:focus { outline: 2px solid #7c3aed; border-color: transparent; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Bienvenido 👋</h1>
    <p class="sub">Ingresa para acceder a las mentorías.</p>

    <label for="nombre">Nombre de usuario</label>
    <input id="nombre" type="text" placeholder="Tu nombre" autocomplete="off">

    <label for="correo">Correo</label>
    <input id="correo" type="email" placeholder="tucorreo@ubo.cl">

    <label for="clave">Clave</label>
    <input id="clave" type="password" placeholder="••••••••">

    <button type="submit">Entrar</button>
  </form>

  <script>
    var KEY = "mentores_usuario";
    var HOME = "index.html"; // <-- cambia esto si tu página principal tiene otro nombre

    // Si ya hay sesión, ir directo a la página principal
    if (localStorage.getItem(KEY)) location.replace(HOME);

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var correo = document.getElementById("correo").value.trim();
      var nombre = document.getElementById("nombre").value.trim();

      // No se verifica nada: si no escribe nombre, se usa lo que va antes del @ del correo
      if (!nombre) nombre = correo ? correo.split("@")[0] : "Usuario";

      localStorage.setItem(KEY, JSON.stringify({ nombre: nombre, correo: correo }));
      location.href = HOME;
    });
  </script>
</body>
</html>
