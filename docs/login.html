<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Mentores para nuevos estudiantes</title>
  <meta name="theme-color" content="#0E2444">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-900: #0E2444;
      --navy-800: #12305A;
      --navy-700: #1B4478;
      --gold: #E9B44C;
      --gold-ink: #3D2A00;
      --line: #D7E0EB;
      --muted: #3F5673;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(160deg, var(--navy-900), var(--navy-700));
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--navy-800);
    }
    .card {
      width: min(400px, 100%);
      background: #fff;
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .brand__logo {
      width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--gold); color: var(--gold-ink);
      font: 600 22px 'Fraunces', Georgia, serif;
    }
    .brand__name { font: 600 20px 'Fraunces', Georgia, serif; color: var(--navy-900); }
    p.sub { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 700; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      color: var(--navy-800);
    }
    input:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--navy-900);
      color: #fff;
      font: 700 16px 'DM Sans', system-ui, sans-serif;
      cursor: pointer;
    }
    input.invalid { border-color: #B3261E; }
    .error { margin: 14px 0 0; color: #B3261E; font-size: 14px; font-weight: 500; }
    button:hover { background: var(--navy-700); }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  </style>
</head>
<body>
  <form class="card" id="loginForm" novalidate>
    <div class="brand">
      <span class="brand__logo" aria-hidden="true">M</span>
      <span class="brand__name">Mentores</span>
    </div>
    <p class="sub">Ingresa para encontrar a tu mentor.</p>

    <label for="nombre">Nombre de usuario</label>
    <input id="nombre" type="text" placeholder="Tu nombre" autocomplete="off">

    <label for="correo">Correo</label>
    <input id="correo" type="email" placeholder="tucorreo@ubo.cl">

    <label for="clave">Clave</label>
    <input id="clave" type="password" placeholder="••••••••">

    <p class="error" id="error" role="alert" hidden></p>

    <button type="submit">Entrar</button>
  </form>

  <script>
    var KEY = 'mentores_usuario';
    var HOME = 'index.html'; // página principal (misma carpeta que este archivo)

    try { if (localStorage.getItem(KEY)) location.replace(HOME); } catch (e) {}

    var campos = [
      { id: 'nombre', etiqueta: 'el nombre de usuario' },
      { id: 'correo', etiqueta: 'el correo' },
      { id: 'clave',  etiqueta: 'la clave' }
    ];
    var errorBox = document.getElementById('error');

    // Al escribir en un campo se le quita el borde rojo
    campos.forEach(function (c) {
      document.getElementById(c.id).addEventListener('input', function () {
        this.classList.remove('invalid');
      });
    });

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      // Solo se exige que todos los datos estén rellenados (no se verifica que sean correctos).
      var faltan = campos.filter(function (c) {
        var input = document.getElementById(c.id);
        var vacio = input.value.trim() === '';
        input.classList.toggle('invalid', vacio);
        return vacio;
      });

      if (faltan.length) {
        errorBox.textContent = 'Completa todos los datos para entrar. Falta: ' +
          faltan.map(function (c) { return c.etiqueta; }).join(', ') + '.';
        errorBox.hidden = false;
        document.getElementById(faltan[0].id).focus();
        return;
      }
      errorBox.hidden = true;

      var nombre = document.getElementById('nombre').value.trim();
      var correo = document.getElementById('correo').value.trim();
      try { localStorage.setItem(KEY, JSON.stringify({ nombre: nombre, correo: correo })); } catch (err) {}
      location.href = HOME;
    });
  </script>
</body>
</html>
